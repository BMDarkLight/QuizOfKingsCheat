name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish a GitHub release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Set version
        run: |
          # Tag builds use the tag (v1.2.0 -> 1.2.0); everything else gets 0.1.<run number>.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
              exit 1
            fi
            echo "::warning::KEYSTORE_BASE64 secret is not set; the release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and name the APK
        run: |
          out=app/build/outputs/apk/release
          mkdir -p dist
          if [ -n "$SIGNING_KEYSTORE_PATH" ]; then
            apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
            "$apksigner" verify --verbose --print-certs "$out/app-release.apk"
            cp "$out/app-release.apk" "dist/qok-helper-$VERSION_NAME.apk"
          else
            cp "$out/app-release-unsigned.apk" "dist/qok-helper-$VERSION_NAME-unsigned.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: qok-helper-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
